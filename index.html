
<!DOCTYPE html>
<html lang="en" data-mode="light" data-glass="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumaro — Study Smarter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============ THEME TOKENS ============ */
:root{
  --font:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  --shadow:0 12px 34px rgba(45,45,110,.10);
  --shadow-sm:0 4px 14px rgba(45,45,110,.08);
  --pop:#6c5ce7; --pop2:#a29bfe;
  --c-quiz:#7c5cff; --c-notes:#ff8a3d; --c-cards:#12b8a6; --c-prog:#ff5c8a;
  --good:#10b981; --bad:#ff4d6d; --warn:#ffb020;
  --blur:0px; --panelA:.0;
  /* translucent "selected" treatment — no opaque fills anywhere */
  --sel:rgba(108,92,231,.14); --sel-line:rgba(108,92,231,.50); --sel-ink:#4b32c9;
}
/* ============ BASE MODE: LIGHT / DARK ============ */
[data-mode="light"]{
  --bg:#f6f7ff; --bg2:#eef0ff;
  --panel:#ffffff; --panel2:#f3f4ff; --panel3:#eaecff;
  --text:#191a35; --muted:#6d7191; --line:rgba(25,26,60,.09);
  --btn:rgba(25,26,60,.05); --btnline:rgba(25,26,60,.10);
  --field:#f6f7ff;
  --shadow:0 12px 34px rgba(45,45,110,.10);
  --sel:rgba(108,92,231,.13); --sel-line:rgba(108,92,231,.55); --sel-ink:#4b32c9;
}
[data-mode="dark"]{
  --bg:#0e0f1e; --bg2:#141631;
  --panel:#191b32; --panel2:#20233d; --panel3:#272a48;
  --text:#f2f3ff; --muted:#9a9ec4; --line:rgba(255,255,255,.09);
  --btn:rgba(255,255,255,.07); --btnline:rgba(255,255,255,.12);
  --field:#20233d;
  --shadow:0 14px 40px rgba(0,0,0,.45);
  --sel:rgba(124,92,255,.24); --sel-line:rgba(160,140,255,.60); --sel-ink:#d9d2ff;
}
/* ============ LIQUID GLASS ============
   Not a third theme — an independent translucent skin that layers on top of
   whichever base mode is active, so you get glassy light AND glassy dark. */
[data-mode="light"][data-glass="on"]{
  --bg:transparent; --bg2:transparent;
  --panel:rgba(255,255,255,.16); --panel2:rgba(255,255,255,.11); --panel3:rgba(255,255,255,.28);
  --text:#0f1030; --muted:#4a4f78; --line:rgba(255,255,255,.85);
  --btn:rgba(255,255,255,.20); --btnline:rgba(255,255,255,.88);
  --field:rgba(255,255,255,.24);
  --rim:rgba(255,255,255,.98);
  --shadow:0 18px 44px rgba(60,40,120,.16);
  --blur:13px;
  --sel:rgba(108,92,231,.20); --sel-line:rgba(255,255,255,.92); --sel-ink:#3a24b8;
}
[data-mode="dark"][data-glass="on"]{
  --bg:transparent; --bg2:transparent;
  --panel:rgba(28,22,60,.22); --panel2:rgba(22,18,50,.16); --panel3:rgba(255,255,255,.12);
  --text:#ffffff; --muted:rgba(255,255,255,.76); --line:rgba(255,255,255,.36);
  --btn:rgba(255,255,255,.13); --btnline:rgba(255,255,255,.42);
  --field:rgba(255,255,255,.12);
  --rim:rgba(255,255,255,.72);
  --shadow:0 20px 55px rgba(0,0,0,.36);
  --blur:13px;
  --sel:rgba(124,92,255,.26); --sel-line:rgba(255,255,255,.50); --sel-ink:#ece7ff;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);color:var(--text);
  background:var(--bg);font-weight:600;
  -webkit-font-smoothing:antialiased;
  transition:background .35s ease,color .35s ease;
}
/* ============ IMPORTED WALLPAPER (Liquid Glass) ============ */
#wallpaper{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;
  background-size:cover;background-position:center;background-repeat:no-repeat;
  transition:opacity .6s ease,filter .3s ease}
[data-glass="on"] #wallpaper.has{opacity:1}
/* ============ LIQUID GLASS BACKDROP ============ */
#liquid{position:fixed;inset:0;z-index:0;opacity:0;pointer-events:none;transition:opacity .7s ease;
  background:#7c5cff;overflow:hidden}
/* The wash drifts by TRANSFORM, not by animating background-position. Moving a
   background repaints the entire viewport every single frame — that repaint was
   the main reason the glass felt heavy. A translated layer is composited. */
#liquid::before{content:"";position:absolute;top:-25%;left:-50%;width:200%;height:150%;
  background:linear-gradient(120deg,#7c5cff,#c44cf0 25%,#ff5c8a 50%,#ffb020 75%,#22d3ee);
  animation:flow 26s ease-in-out infinite;will-change:transform}
@keyframes flow{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-25%,0,0)}}
[data-glass="on"] #liquid{opacity:1}
/* Soft edges come from a radial-gradient fade, NOT filter:blur(). An 80px blur on
   four ~50vw blobs was by far the most expensive thing on the page - hundreds of
   millions of blur samples per frame. A baked gradient costs nothing to composite. */
#liquid span{position:absolute;border-radius:50%;opacity:.8;
  will-change:transform}
/* fine texture gives the refraction something to visibly bend */
#liquid::after{content:"";position:absolute;inset:-10%;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.55) 1.2px,transparent 1.7px);
  background-size:24px 24px;opacity:.20}
/* a real photo supplies its own texture — fade the colour wash and drop the dots */
[data-glass="on"] #liquid.wall{opacity:.45}
#liquid.wall::after{display:none}
/* A photo already supplies the texture, so freeze the drifting wash. With the
   backdrop static it stops changing frame to frame, which means the browser can
   reuse the blurred backdrop instead of recomputing it constantly. */
#liquid.wall::before,#liquid.wall span{animation:none}
/* settings preview tile */
.wallprev{width:100%;height:132px;border-radius:var(--r-sm);border:1px solid var(--line);
  background-size:cover;background-position:center;background-color:var(--panel3);
  display:grid;place-items:center;text-align:center;padding:12px;color:var(--muted);font-size:13px;font-weight:800}
#liquid span:nth-child(1){width:52vw;height:52vw;left:-10vw;top:-14vw;background:radial-gradient(circle at 50% 50%,#22d3ee 0%,rgba(34,211,238,.55) 42%,rgba(34,211,238,0) 72%);animation:drift1 18s ease-in-out infinite}
#liquid span:nth-child(2){width:46vw;height:46vw;right:-12vw;top:6vh;background:radial-gradient(circle at 50% 50%,#ffd166 0%,rgba(255,209,102,.55) 42%,rgba(255,209,102,0) 72%);animation:drift2 22s ease-in-out infinite}
#liquid span:nth-child(3){width:44vw;height:44vw;left:18vw;bottom:-18vw;background:radial-gradient(circle at 50% 50%,#ff5c8a 0%,rgba(255,92,138,.55) 42%,rgba(255,92,138,0) 72%);animation:drift3 20s ease-in-out infinite}
#liquid span:nth-child(4){width:34vw;height:34vw;right:14vw;bottom:-12vw;background:radial-gradient(circle at 50% 50%,#7c5cff 0%,rgba(124,92,255,.55) 42%,rgba(124,92,255,0) 72%);animation:drift1 26s ease-in-out infinite reverse}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(8vw,6vh) scale(1.15)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-7vw,9vh) scale(1.1)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,-7vh) scale(1.12)}}
#root{position:relative;z-index:1}
.hidden{display:none!important}
/* ============ SHARED ============ */
/* No backdrop-filter here on purpose: --panel is opaque, so blurring what
   sits behind a card was invisible and only cost a compositing pass. */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
}
[data-glass="on"] .card{position:relative;overflow:hidden}
[data-glass="on"] .card::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;z-index:2;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent)}
/* ============ LIQUID GLASS REFRACTION ============
   Clear panels that bend the backdrop behind them (SVG displacement through
   backdrop-filter), the way real glass bends whatever sits behind it.
   The plain-blur declaration above/below stays as the fallback for engines
   that don't support url() filters in backdrop-filter. */
[data-glass="on"] .card,
[data-glass="on"] .qcard,
[data-glass="on"] .note,
[data-glass="on"] .side,
[data-glass="on"] .auth-panel,
[data-glass="on"] .mobilebar,
[data-glass="on"] .modal .box,
[data-glass="on"] .tabs button.on{
  -webkit-backdrop-filter:blur(var(--blur)) saturate(140%);
  backdrop-filter:blur(var(--blur)) saturate(140%);
  backdrop-filter:blur(var(--blur)) saturate(140%) url(#lg-warp);
}
/* specular rim — the bright bevelled edge that sells the glass */
[data-glass="on"] .card,
[data-glass="on"] .qcard,
[data-glass="on"] .note,
[data-glass="on"] .modal .box,
[data-glass="on"] .mobilebar{
  box-shadow:inset 0 1px 0 var(--rim),inset 0 -1px 0 rgba(255,255,255,.16),
    inset 1px 0 0 rgba(255,255,255,.20),inset -1px 0 0 rgba(255,255,255,.20),
    inset 0 0 26px rgba(255,255,255,.10),var(--shadow);
}
[data-glass="on"] .side{border-right:1px solid var(--line);
  box-shadow:inset -1px 0 0 rgba(255,255,255,.18)}
[data-glass="on"] input,[data-glass="on"] select,[data-glass="on"] textarea{
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.30)}
button{font-family:inherit;font-weight:800;cursor:pointer;border:none;color:inherit}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:999px;background:var(--btn);border:1px solid var(--btnline);
  font-size:14px;transition:transform .12s ease,box-shadow .2s ease,background .2s ease;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(135deg,var(--pop),#b14aed);color:#fff;border-color:transparent;
  box-shadow:0 10px 24px rgba(108,92,231,.38)}
.btn-lg{padding:15px 26px;font-size:16px;border-radius:999px}
.btn-ghost{background:transparent}
.btn-danger{background:rgba(255,77,109,.14);border-color:rgba(255,77,109,.35);color:var(--bad)}
.btn-block{width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;
  font-size:12px;font-weight:800;background:var(--btn);border:1px solid var(--btnline)}
.pill-plus{background:linear-gradient(135deg,#ffb020,#ff6b6b);color:#fff;border-color:transparent}
.pill-good{background:rgba(16,185,129,.16);color:var(--good);border-color:rgba(16,185,129,.3)}
.pill-bad{background:rgba(255,77,109,.16);color:var(--bad);border-color:rgba(255,77,109,.3)}
input,select,textarea{font-family:inherit;font-weight:600;font-size:15px;color:var(--text);
  background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:13px 16px;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
/* inputs, selects and textareas inherit the glass tokens automatically */
input:focus,select:focus,textarea:focus{border-color:var(--pop);box-shadow:0 0 0 4px rgba(108,92,231,.18)}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 7px 4px;font-weight:800}
.field{margin-bottom:15px}
h1,h2,h3{margin:0;line-height:1.15;font-weight:900}
h1{font-size:30px}h2{font-size:21px}h3{font-size:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grid{display:grid;gap:16px}
.wrap{flex-wrap:wrap}
.mt{margin-top:16px}.mt-s{margin-top:8px}.mb{margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:12px;transform:translate(-50%,120%);
  background:#191a35;color:#fff;padding:13px 22px;border-radius:999px;font-weight:800;font-size:14px;
  box-shadow:0 16px 40px rgba(0,0,0,.35);z-index:99;cursor:pointer;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:transform .35s cubic-bezier(.2,1.4,.5,1),opacity .25s ease,visibility .25s}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto}
/* ============ AUTH ============ */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
.auth-hero{padding:56px;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(150deg,#6c5ce7,#a855f7 45%,#ff5c8a);color:#fff;position:relative;overflow:hidden}
.auth-hero::after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.30),transparent 65%);right:-160px;bottom:-180px}
.auth-hero .brand{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:900;position:relative}
.hero-copy{position:relative;z-index:1}
.hero-copy h1{font-size:46px;line-height:1.06;margin-bottom:16px}
.hero-copy p{font-size:16px;opacity:.92;max-width:420px;font-weight:600}
.hero-badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;position:relative;z-index:1}
.hero-badges span{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.34);
  padding:8px 15px;border-radius:999px;font-size:13px;font-weight:800}
.auth-panel{display:flex;align-items:center;justify-content:center;padding:40px 28px;background:var(--panel);backdrop-filter:blur(var(--blur))}
.auth-box{width:100%;max-width:410px}
.tabs{display:flex;gap:6px;background:var(--btn);padding:5px;border-radius:999px;margin-bottom:26px}
.tabs button{flex:1;padding:11px;border-radius:999px;background:transparent;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow-sm)}
[data-glass="on"] .tabs button.on{background:var(--panel);color:var(--text)}
.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,#6c5ce7,#ff5c8a);color:#fff;font-size:20px;
  box-shadow:0 8px 20px rgba(108,92,231,.4)}
/* ============ APP SHELL ============ */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{padding:22px 16px;border-right:1px solid var(--line);background:var(--panel2);
  backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  display:flex;flex-direction:column;gap:8px;position:sticky;top:0;height:100vh}
.side .brand{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:900;padding:6px 8px 20px}
.nav{display:flex;flex-direction:column;gap:5px;flex:1}
.nav button{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:16px;
  background:transparent;font-size:15px;text-align:left;color:var(--muted);transition:all .18s}
.nav button:hover{background:var(--btn);color:var(--text)}
.nav button.on{background:transparent;color:#fff;box-shadow:none}
.nav .ico{font-size:18px;width:22px;text-align:center}
.main{padding:26px 30px 60px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:24px;flex-wrap:wrap}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;
  background:linear-gradient(135deg,#12b8a6,#6c5ce7)}
/* theme segmented */
.seg{display:flex;gap:4px;background:var(--btn);border:1px solid var(--btnline);padding:4px;border-radius:999px}
.seg button{padding:8px 14px;border-radius:999px;background:transparent;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow-sm)}
[data-glass="on"] .seg button.on{background:var(--panel);color:var(--text)}
.glassbtn{padding:10px 16px;border-radius:999px;background:var(--btn);border:1px solid var(--btnline);
  font-size:13px;font-weight:800;color:var(--muted);display:inline-flex;align-items:center;gap:7px;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .24s ease,background .2s ease}
.glassbtn:hover{transform:translateY(-2px)}
.glassbtn.on{background:linear-gradient(135deg,#6c5ce7,#22d3ee);color:#fff;border-color:transparent;
  box-shadow:0 10px 24px rgba(34,211,238,.42);transform:translateY(-3px) scale(1.05)}
/* stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.stat{padding:20px;border-radius:var(--r-md);position:relative;overflow:hidden}
.stat .ic{font-size:22px;margin-bottom:10px}
.stat .v{font-size:32px;font-weight:900;line-height:1}
.stat .l{font-size:13px;color:var(--muted);margin-top:6px}
.hero-card{padding:28px;border-radius:var(--r-lg);background:linear-gradient(135deg,#6c5ce7,#a855f7 55%,#ff5c8a);
  color:#fff;box-shadow:0 18px 44px rgba(108,92,231,.35)}
.hero-card h1{font-size:32px;margin-bottom:10px}
.hero-card p{opacity:.94;max-width:560px;margin:0 0 20px;font-weight:600}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.qcard{padding:22px;border-radius:var(--r-md);text-align:left;background:var(--panel);
  border:1px solid var(--line);transition:transform .16s,box-shadow .2s}
.qcard:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.qcard .ic{font-size:28px;margin-bottom:12px}
.qcard .t{font-weight:900;font-size:16px;margin-bottom:5px}
.qcard .d{font-size:13px;color:var(--muted);font-weight:600}
/* quiz */
.slider{width:100%;-webkit-appearance:none;height:10px;border-radius:999px;padding:0;outline:none;border:none;
  background-color:var(--btn);background-image:linear-gradient(90deg,var(--pop),var(--pop2));
  background-repeat:no-repeat;background-size:var(--p,0%) 100%;
  box-shadow:inset 0 0 0 1px var(--btnline)}
/* the dial is a warping lens. It sits on the boundary between the filled and
   empty track, so its texture is split at its own centre — stretched blue
   streaks left, pale ones right — and lines up wherever the thumb lands.
   The blur lives inside the SVG because filter:/backdrop-filter: are both
   ignored on ::-webkit-slider-thumb. stdDeviation tunes the softness. */
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:22px;border-radius:999px;
  background-color:transparent;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2768%27%20height%3D%2744%27%20viewBox%3D%270%200%2068%2044%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%271%27%20y2%3D%270%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%233730a3%27%20stop-opacity%3D%27.85%27%2F%3E%3Cstop%20offset%3D%27.34%27%20stop-color%3D%27%234f46e5%27%20stop-opacity%3D%27.90%27%2F%3E%3Cstop%20offset%3D%27.47%27%20stop-color%3D%27%236366f1%27%20stop-opacity%3D%27.85%27%2F%3E%3Cstop%20offset%3D%27.53%27%20stop-color%3D%27%23c7d2fe%27%20stop-opacity%3D%27.70%27%2F%3E%3Cstop%20offset%3D%27.68%27%20stop-color%3D%27%23ffffff%27%20stop-opacity%3D%27.42%27%2F%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%23ffffff%27%20stop-opacity%3D%27.18%27%2F%3E%3C%2FlinearGradient%3E%3Cfilter%20id%3D%27b%27%20x%3D%27-1%27%20y%3D%27-1%27%20width%3D%273%27%20height%3D%273%27%3E%3CfeGaussianBlur%20stdDeviation%3D%272.8%27%2F%3E%3C%2Ffilter%3E%3C%2Fdefs%3E%3Cg%20filter%3D%27url%28%23b%29%27%20fill%3D%27none%27%20stroke%3D%27url%28%23g%29%27%20stroke-linecap%3D%27round%27%3E%3Cpath%20d%3D%27M-8%206%20Q%2010%200%2034%207%20T%2076%205%27%20stroke-width%3D%276%27%2F%3E%3Cpath%20d%3D%27M-8%2015%20Q%2012%2021%2034%2014%20T%2076%2016%27%20stroke-width%3D%279%27%2F%3E%3Cpath%20d%3D%27M-8%2025%20Q%2010%2019%2034%2026%20T%2076%2024%27%20stroke-width%3D%278%27%2F%3E%3Cpath%20d%3D%27M-8%2035%20Q%2012%2041%2034%2034%20T%2076%2036%27%20stroke-width%3D%276%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
  background-size:100% 100%;background-repeat:no-repeat;
  border:2px solid var(--pop);
  box-shadow:0 4px 14px rgba(108,92,231,.34),inset 0 1px 0 rgba(255,255,255,.70);
  cursor:pointer;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.slider:hover::-webkit-slider-thumb{transform:scale(1.12)}
.slider:active::-webkit-slider-thumb{transform:scale(1.04)}
.slider::-moz-range-thumb{width:34px;height:22px;border-radius:999px;background-color:transparent;

  border:2px solid var(--pop);
  box-shadow:0 4px 14px rgba(108,92,231,.34),inset 0 1px 0 rgba(255,255,255,.70);cursor:pointer}
.quicknums{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

.progressbar{height:12px;border-radius:999px;background:var(--panel3);overflow:hidden}

  transition:width .35s cubic-bezier(.3,1.2,.5,1)}

.ring{width:180px;height:180px;border-radius:50%;display:grid;place-items:center;margin:0 auto;position:relative}

.chips{display:flex;gap:8px;flex-wrap:wrap}

.fcard{perspective:1200px;height:280px;cursor:pointer}

[data-glass="on"] .modal .box{background:var(--panel);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(140%);

[data-mode="light"][data-glass="on"] .modal .box{background:rgba(255,255,255,.55)}
[data-mode="dark"][data-glass="on"] .modal .box{background:rgba(30,24,64,.55)}
/* ============ INTERACTIONS (lift / expand on select) ============ */

.btn:active{transform:translateY(1px) scale(.97)}
.qcard:hover,.note:hover,.stat:hover{transform:translateY(-6px) scale(1.02);box-shadow:var(--shadow)}
.qcard:active,.note:active{transform:translateY(-2px) scale(.99)}
.chip:hover,.quicknums button:hover,.subj button:hover{transform:translateY(-3px) scale(1.05)}
.seg button:hover,.tabs button:hover,.mobilebar button:hover{transform:translateY(-2px)}

.choice:active{transform:translateX(3px) scale(.995)}
/* selected / active states pop up and expand */
.chip.on,.quicknums button.on,.subj button.on,.seg button.on,.tabs button.on{
  transform:translateY(-4px) scale(1.06);
}
.chip.on{box-shadow:0 8px 20px rgba(108,92,231,.22),inset 0 1px 0 var(--rim)}
.quicknums button.on{box-shadow:0 8px 20px rgba(108,92,231,.22),inset 0 1px 0 var(--rim)}

/* The selected tab keeps its gradient pill flush in its slot. It used to be

   padding and widened it over its neighbours - that is what looked misaligned. */

/* ============ SLIDING NAV PILL ============ */
/* One gradient pill lives inside the bar and glides between items, rather than
   every item painting its own background the instant you click it. */
.nav{position:relative}

/* achievements */

.badge:hover{transform:translateY(-5px) scale(1.03)}

<body>
<div id="wallpaper"></div>
<div id="liquid"><span></span><span></span><span></span><span></span></div>
<div id="root"></div>
<div id="toast" class="toast"></div>
<div id="modal-root"></div>
<!-- displacement map that warps whatever sits behind a glass surface -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;pointer-events:none">
  <filter id="lg-warp" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.005 0.008" numOctaves="1" seed="11" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
    <feDisplacementMap in="SourceGraphic" in2="soft" scale="34"
      xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<script>
/* =========================================================
   Lumaro — front-end prototype
   NOTE: data is stored in localStorage. This is a UI prototype;
   real authentication + a server database are still required
   for production (see notes at the end of the build).
   ========================================================= */
/* Storage that keeps working when localStorage is unavailable
   (sandboxed preview iframes, private mode). Every write is mirrored in
   memory, so accounts and saved work still function for the session. */
const MEM={};
let LS_OK=true;
try{localStorage.setItem('__sv_probe','1');localStorage.removeItem('__sv_probe')}catch(e){LS_OK=false}
const LS={
  get(k,d){
    if(LS_OK){try{const v=localStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){}}
    return (k in MEM)?MEM[k]:d;
  },
  set(k,v){MEM[k]=v;if(LS_OK){try{localStorage.setItem(k,JSON.stringify(v))}
    catch(e){if(e&&e.name==='SecurityError')LS_OK=false}}},
  del(k){delete MEM[k];if(LS_OK){try{localStorage.removeItem(k)}catch(e){}}}
};
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h)^s.charCodeAt(i);return 'h'+(h>>>0).toString(16)}
function hideToast(){const t=$('#toast');if(t)t.classList.remove('show')}
function toast(msg){const t=$('#toast');if(!t)return;t.textContent=msg;t.classList.add('show');
  clearTimeout(t._x);t._x=setTimeout(hideToast,2400)}
function openModal(html){const m=$('#modal-root');if(m)m.innerHTML='<div class="modal" data-act="modalclose"><div class="box">'+html+'</div></div>'}
function closeModal(){const m=$('#modal-root');if(m)m.innerHTML=''}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------------- THEME: base mode + independent Liquid Glass ---------------- */
function getMode(){return LS.get('sv_mode','light')==='dark'?'dark':'light'}
function setMode(m){LS.set('sv_mode',m);render()}
function isGlass(){return LS.get('sv_glass',false)===true}
function setGlass(on){LS.set('sv_glass',!!on);render()}
function wallData(){return LS.get('sv_wall','')}
function wallDim(){const v=LS.get('sv_wall_dim',0.25);return (typeof v==='number'&&v>=0&&v<=0.9)?v:0.25}
function applyTheme(){
  const el=document.documentElement;
  el.dataset.mode=getMode();
  el.dataset.glass=isGlass()?'on':'off';
  const wall=wallData();
  const wp=document.getElementById('wallpaper');
  if(wp){
    wp.classList.toggle('has',!!wall);
    wp.style.backgroundImage=wall?'url("'+wall+'")':'';
    wp.style.filter='brightness('+(1-wallDim())+')';
  }
  const li=document.getElementById('liquid');
  if(li)li.classList.toggle('wall',!!wall);
  applyLook();
  applyWarp();
}
/* ---------------- WARP STRENGTH (Liquid Glass refraction) ----------------
   The scale on the feDisplacementMap that bends the backdrop. 0 = plain
   frosted blur, higher = the glass bends the background harder. */
function warpAmount(){const v=LS.get('sv_warp',34);return (typeof v==='number'&&v>=0&&v<=150)?Math.round(v):34}
/* ---- appearance: glass blur + backdrop brightness -------------------------- */
/* How frosted the glass is. 0 is perfectly clear glass - no blur at all. */
function glassBlur(){const v=LS.get('sv_gblur',13);return (typeof v==='number'&&v>=0&&v<=40)?Math.round(v):13}
/* Brightness of whatever sits behind the glass, 40-160 (%). */
function backBright(){const v=LS.get('sv_bright',100);return (typeof v==='number'&&v>=40&&v<=160)?Math.round(v):100}
/* Kept separate from applyTheme so dragging these sliders never forces the SVG
   displacement filter to rebuild - that is the expensive part of a theme pass. */
function applyLook(){
  const el=document.documentElement;
  if(isGlass())el.style.setProperty('--blur',glassBlur()+'px');
  else el.style.removeProperty('--blur');
  const br=backBright()/100;
  const wp=document.getElementById('wallpaper');
  if(wp)wp.style.filter='brightness('+(Math.round((1-wallDim())*br*1000)/1000)+')';
  const li=document.getElementById('liquid');
  if(li)li.style.filter=(br===1||!isGlass())?'':'brightness('+br+')';
}
function applyWarp(){
  const f=document.getElementById('lg-warp');if(!f||!f.querySelector)return;
  const d=f.querySelector('feDisplacementMap');if(!d)return;
  const v=String(warpAmount());
  if(d.setAttribute)d.setAttribute('scale',v);
  /* swapping the node makes the engine rebuild the filter, so dragging the
     slider updates the refraction live instead of only on the next repaint */
  try{const c=d.cloneNode&&d.cloneNode(false);if(c&&f.replaceChild)f.replaceChild(c,d)}catch(e){}
}
/* Import an image as the Liquid Glass background. Large photos are downscaled
   and re-encoded before being stored, so one wallpaper fits comfortably. */
function handleWallpaperFile(file){
  if(!file){return}
  if(!/^image\//.test(file.type||'')){toast('Please choose an image file');return}
  const reader=new FileReader();
  reader.onerror=()=>toast('Could not read that file');
  reader.onload=()=>{
    const img=new Image();
    img.onerror=()=>toast('Could not read that image');
    img.onload=()=>{
      const MAX=1600;
      let w=img.width||MAX,h=img.height||MAX;
      if(Math.max(w,h)>MAX){const s=MAX/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}
      let out=reader.result;
      try{
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const cx=c.getContext('2d');
        cx.drawImage(img,0,0,w,h);
        out=c.toDataURL('image/jpeg',0.82);
      }catch(e){/* keep the original data URL */}
      LS.set('sv_wall',out);
      if(!isGlass())setGlass(true);
      toast('Background applied 🖼️');
      render();
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

/* ---------------- EMAIL DELIVERY (EmailJS) ---------------- */
function emailCfg(){return LS.get('sv_email',{serviceId:'',templateId:'',publicKey:''})}
function saveEmailCfg(c){LS.set('sv_email',c)}
function emailReady(){const c=emailCfg();return !!(c.serviceId&&c.templateId&&c.publicKey)}
async function sendEmail(to,subject,message,extra){
  const c=emailCfg();
  if(!(c.serviceId&&c.templateId&&c.publicKey))return {ok:false,reason:'not connected'};
  try{
    const res=await fetch('https://api.emailjs.com/api/v1.0/email/send',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({service_id:c.serviceId,template_id:c.templateId,user_id:c.publicKey,
        template_params:Object.assign({to_email:to,email:to,subject,message,app_name:'Lumaro'},
          (extra&&typeof extra==='object')?extra:{})})});
    if(res.ok)return {ok:true};
    const text=await res.text().catch(()=> '');
    return {ok:false,reason:'send failed '+res.status,detail:text};
  }catch(e){return {ok:false,reason:'network blocked'}}
}
function code6(){return String(Math.floor(100000+Math.random()*900000))}
const CODE_TTL=15*60*1000;   /* codes are valid for 15 minutes, matching the email copy */
/* Set to true to require an emailed 6-digit code before an account is usable.
   false = sign up signs you straight in. The entire verification path is still
   intact, so flipping this back to true restores it (EmailJS must be connected). */
const REQUIRE_EMAIL_VERIFY=false;
function fmtTime(ts){try{return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function putCode(id,code,exp){LS.set('sv_code_'+id,{code:code,exp:exp||(Date.now()+CODE_TTL)})}
function getCode(id){const v=LS.get('sv_code_'+id,null);if(!v)return null;
  return typeof v==='string'?{code:v,exp:0}:v}   /* a bare string is a legacy record */
function codeOk(id,entered){
  const r=getCode(id);
  const mismatch={err:'That code doesn\u2019t match \u2014 check your email and try again'};
  if(!r||!r.code)return mismatch;
  if(r.exp&&Date.now()>r.exp)return {err:'That code has expired \u2014 request a new one'};
  if(entered!==r.code)return mismatch;
  return {ok:true};
}
/* send every alias a template might name the code, so either design works */
function otpVars(code,exp){return {passcode:code,code:code,otp:code,time:fmtTime(exp),expires_in:'15 minutes'}}
const DISPOSABLE=['mailinator.com','10minutemail.com','tempmail.com','guerrillamail.com','yopmail.com','trashmail.com','throwawaymail.com','temp-mail.org','fakeinbox.com','sharklasers.com'];
const TYPOS={'gmial.com':'gmail.com','gmai.com':'gmail.com','gmail.co':'gmail.com','gnail.com':'gmail.com','hotmial.com':'hotmail.com','hotmai.com':'hotmail.com','outlok.com':'outlook.com','outlook.co':'outlook.com','yahho.com':'yahoo.com','yaho.com':'yahoo.com','iclould.com':'icloud.com','iclod.com':'icloud.com'};
function checkEmail(raw){
  const e=(raw||'').trim().toLowerCase();
  if(!/^[a-z0-9._%+-]+@[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,}$/.test(e))return {err:'That doesn\u2019t look like a valid email address.'};
  const dom=e.split('@')[1];
  if(DISPOSABLE.includes(dom))return {err:'Please use a permanent email \u2014 disposable addresses are not accepted.'};
  if(TYPOS[dom])return {err:'Did you mean @'+TYPOS[dom]+'? Please check the spelling.'};
  return {ok:true,email:e};
}

/* ---------------- AUTH STORE ---------------- */
function users(){return LS.get('sv_users',[])}
function saveUsers(u){LS.set('sv_users',u)}
function currentUser(){const id=LS.get('sv_session',null);if(!id)return null;return users().find(u=>u.id===id)||null}
function userData(id){return LS.get('sv_data_'+id,{notes:[],sets:[],attempts:[],plus:false,created:Date.now()})}
function saveData(id,d){LS.set('sv_data_'+id,d)}

function signup(name,email,pass){
  name=(name||'').trim();
  const chk=checkEmail(email); if(chk.err)return {err:chk.err};
  email=chk.email;
  if(name.length<2)return {err:'Please enter your name.'};
  if((pass||'').length<6)return {err:'Password must be at least 6 characters.'};
  const u=users();
  if(u.some(x=>x.email===email))return {err:'An account with that email already exists.'};
  const nu={id:uid(),name,email,pass:hash(pass),created:Date.now(),verified:false};
  u.push(nu);saveUsers(u);saveData(nu.id,userData(nu.id));
  return {ok:true,user:nu};
}
async function startVerify(user){
  const code=code6(),exp=Date.now()+CODE_TTL;
  putCode(user.id,code,exp);
  state.verify={userId:user.id,email:user.email,status:'sending'};
  state.authTab='verify';render();
  const res=await sendEmail(user.email,'Your Lumaro verification code',
    'Hi '+user.name+',\n\nYour Lumaro verification code is: '+code+'\n\nIf you did not sign up, you can ignore this email.',
    otpVars(code,exp));
  if(!state.verify||state.verify.userId!==user.id)return;
  state.verify.status=res.ok?'sent':(res.reason||'error');
  render();
}

function login(email,pass){
  email=(email||'').trim().toLowerCase();
  const u=users().find(x=>x.email===email);
  if(!u)return {err:'No account found with that email.'};
  if(u.pass!==hash(pass||''))return {err:'Incorrect password or email. Try again.'};
  LS.set('sv_session',u.id);return {ok:true};
}

  state.quiz=null;state.study=null;state.noteEdit=null;state.setEdit=null;
  LS.del('sv_session');render()}

function mcq(q,right,wrong){return {q,choices:shuffle([right,...wrong]),answer:right}}
function near(n){const set=new Set();while(set.size<3){const d=(Math.random()<.5?-1:1)*Math.max(1,Math.round(Math.random()*Math.max(2,Math.round(n*.25))));
  const v=n+d;if(v!==n&&v>0)set.add(v)}return [...set]}
function genMath(){
  const out=[],seen=new Set();
  const add=(q,right)=>{if(seen.has(q))return false;seen.add(q);out.push(mcq(q,String(right),near(right).map(String)));return true};
  for(let a=2;a<=12;a++)for(let b=2;b<=12;b++)add(a+' × '+b+' = ?',a*b);
  [4,6,7,8,9,11,12,13,14,15].forEach(n=>add('What is '+n+'² ?',n*n));
  let tries=0;
  while(out.filter(q=>q.q.indexOf(' + ')>-1).length<26 && tries++<600){
    const a=20+Math.floor(Math.random()*80),b=20+Math.floor(Math.random()*80);
    add(a+' + '+b+' = ?',a+b);
  }
  tries=0;
  while(out.filter(q=>q.q.indexOf('% of')>-1).length<22 && tries++<600){
    const p=[10,20,25,50][Math.floor(Math.random()*4)],n=(1+Math.floor(Math.random()*14))*20;
    add('What is '+p+'% of '+n+' ?',p*n/100);
  }
  return out;
}

function customCount(d,subject){const c=(d&&d.custom)||{};return ((BANK[subject]||[]).length)+((c[subject]||[]).length)}
function poolFor(subject,d){
  const custom=(d&&d.custom)||{};
  const fromBank=name=>((BANK[name]||[]).map(q=>({...q,subject:name}))).concat((custom[name]||[]).map(q=>({...q,subject:name})));
  if(subject==='Mixed'){
    let all=[];
    Object.keys(BANK).forEach(k=>{all=all.concat(fromBank(k))});
    Object.keys(custom).forEach(k=>{if(!BANK[k])all=all.concat(fromBank(k))});
    return all;
  }
  return fromBank(subject);
}
function buildQuiz(subject,count,d){
  const pool=shuffle(poolFor(subject,d));
  if(!pool.length)return [];
  return pool.slice(0,Math.min(count,pool.length));
}

/* ---------------- VIEWS ---------------- */
function renderView(u,d){
  /* An in-progress quiz is deliberately NOT tied to the quiz view. You can go
     and read your notes or check the dashboard and then come back to Quizzes
     to carry on where you left off. Only Quit clears it. */
  if(state.view==='dashboard')return viewDash(u,d);
  if(state.view==='quiz')return viewQuiz(u,d);
  if(state.view==='notes')return viewNotes(u,d);
  if(state.view==='flash')return viewFlash(u,d);
  if(state.view==='progress')return viewProgress(u,d);
  if(state.view==='settings')return viewSettings(u,d);
  return '';
}
function avgScore(d){if(!d.attempts.length)return 0;return Math.round(d.attempts.reduce((s,a)=>s+(a.correct/a.total*100),0)/d.attempts.length)}
function streak(d){
  const days=new Set(d.attempts.map(a=>new Date(a.date).toDateString()));
  let n=0,cur=new Date();
  while(days.has(cur.toDateString())){n++;cur.setDate(cur.getDate()-1)}
  return n;
}
function viewDash(u,d){
  const avg=avgScore(d),st=streak(d);
  const recent=d.attempts.slice(0,4);
  return '<div class="hero-card mb">'+
      '<h1>Ready for a quick win, '+esc(u.name.split(' ')[0])+'?</h1>'+
      '<p>Pick a subject, choose 10–100 questions, and let Lumaro track every answer for you.</p>'+
      '<div class="row wrap"><button class="btn btn-lg" style="background:#fff;color:#5b3fd6" data-act="startquick">🧠 Start a quiz</button>'+
      '<button class="btn btn-lg btn-ghost" style="color:#fff;border-color:rgba(255,255,255,.5)" data-act="nav" data-view="notes">📝 Open notes</button></div>'+
    '</div>'+
    '<div class="stats mb">'+
      stat('📈','Average score',avg+'%','Across '+d.attempts.length+' quiz'+(d.attempts.length===1?'':'zes'))+
      stat('🔥','Study streak',st+' day'+(st===1?'':'s'),st?'Keep it going!':'Take a quiz to start')+
      stat('📝','Saved notes',d.notes.length,'Organized by subject')+
      stat('🃏','Flashcard sets',d.sets.length,'Ready to review')+
    '</div>'+
    '<h2 class="mb">Jump back in</h2>'+
    '<div class="quick mb">'+
      qcard('🧠','Take a quiz','10–100 questions, instant score','nav','quiz')+
      qcard('📝','Write a note','Save it to a subject folder','nav','notes')+
      qcard('🃏','Review flashcards','Flip, shuffle, master','nav','flash')+
      qcard('📈','See your progress','Spot weak topics fast','nav','progress')+
    '</div>'+
    '<h2 class="mb">Recent attempts</h2>'+
    (recent.length?'<div class="card" style="padding:8px 20px">'+recent.map(a=>
      '<div class="listrow"><div style="font-size:22px">'+subjIco(a.subject)+'</div>'+
      '<div style="flex:1"><div style="font-weight:900">'+esc(a.subject)+' quiz</div>'+
      '<div class="small muted">'+new Date(a.date).toLocaleDateString()+' • '+a.total+' questions</div></div>'+
      '<div class="pill '+(a.correct/a.total>=.7?'pill-good':'pill-bad')+'">'+Math.round(a.correct/a.total*100)+'%</div></div>').join('')+'</div>'
      :'<div class="card center muted" style="padding:34px">No quizzes yet — your first score will show up here.</div>');
}
function stat(ic,v,l,s){return '<div class="card stat"><div class="ic">'+ic+'</div><div class="v">'+v+'</div>'+
  '<div class="l">'+l+'</div><div class="small muted mt-s">'+s+'</div></div>'}
function qcard(ic,t,dv,act,val){return '<button class="qcard" data-act="'+act+'" data-view="'+val+'">'+
  '<div class="ic">'+ic+'</div><div class="t">'+t+'</div><div class="d">'+dv+'</div></button>'}
function subjIco(s){return {Math:'➗',Science:'🔬',History:'🏛️',Vocabulary:'📖',Mixed:'🎲'}[s]||'📚'}

/* ---------- QUIZ ---------- */
function viewQuiz(u,d){
  if(state.quiz&&state.quiz.stage==='run')return quizRun();
  if(state.quiz&&state.quiz.stage==='result')return quizResult();
  return quizSetup(u,d);
}
function quizSetup(u,d){
  const c=state.quizCount;
  const custom=(d&&d.custom)||{};
  const countFor=n=>customCount(d,n);
  const mixedCount=Object.keys(BANK).reduce((a,k)=>a+countFor(k),0)
    +Object.keys(custom).filter(k=>!BANK[k]).reduce((a,k)=>a+countFor(k),0);
  const cats=['All'].concat(Object.keys(CATALOG_RAW));
  const q=state.quizSearch.trim().toLowerCase();
  const list=SUBJECT_CATALOG.filter(s=>(state.quizCat==='All'||s.c===state.quizCat)&&(!q||s.n.toLowerCase().includes(q)));
  const sel=state.quizSubject;
  const selCount=sel==='Mixed'?mixedCount:countFor(sel);
  return '<div class="card" style="padding:26px">'+
    '<h2 class="mb">Build your quiz</h2>'+
    '<label>Search subjects</label>'+
    '<input data-act="qsearch" placeholder="🔍 Search '+SUBJECT_CATALOG.length+' subjects — chemistry, Spanish, calculus…" value="'+esc(state.quizSearch)+'">'+
    '<div class="chips" style="margin-top:12px">'+cats.map(x=>'<button class="chip '+(state.quizCat===x?'on':'')+'" data-act="qcat" data-c="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div>'+
    '<div class="subj" style="margin-top:12px">'+
      '<button data-act="qsubj" data-s="Mixed" class="'+(sel==='Mixed'?'on':'')+'"><div style="font-weight:900">🎲 Mixed — everything</div>'+
      '<div class="small '+(sel==='Mixed'?'':'muted')+'">'+mixedCount+' questions</div></button>'+
    '</div>'+
    '<div id="subjgrid" class="subj" style="margin-top:6px;max-height:344px;overflow-y:auto;overflow-x:hidden;padding:8px 10px 12px 4px">'+
      (list.length?list.map(s=>{const n=countFor(s.n);
        return '<button data-act="qsubj" data-s="'+esc(s.n)+'" data-name="'+esc(s.n)+'" class="'+(sel===s.n?'on':'')+'">'+
        '<div style="font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(s.n)+'</div>'+
        '<div class="small '+(sel===s.n?'':'muted')+'">'+(n?n+' question'+(n===1?'':'s'):'＋ add your own')+'</div></button>'}).join('')
        :'<div class="muted small" style="padding:16px">No subjects match “'+esc(state.quizSearch)+'”.</div>')+
    '</div>'+
    '<div class="between mt wrap"><div><div class="small muted">Selected subject</div>'+
      '<div style="font-weight:900;font-size:17px">'+esc(sel)+'</div>'+
      '<div class="small muted">'+selCount+' question'+(selCount===1?'':'s')+' available</div></div>'+
      '<button class="btn" data-act="addq" data-s="'+esc(sel==='Mixed'?'General':sel)+'">＋ Add your own questions</button></div>'+
    '<label style="margin-top:22px">How many questions?</label>'+
    '<div class="between"><input class="slider" type="range" min="10" max="100" step="1" value="'+c+'" data-act="qcount">'+
      '<div style="font-size:34px;font-weight:900;color:var(--pop);min-width:96px;text-align:right">'+c+'</div></div>'+
    '<div class="quicknums">'+[10,20,30,50,75,100].map(n=>'<button data-act="qnum" data-n="'+n+'" class="'+(c===n?'on':'')+'">'+n+'</button>').join('')+'</div>'+
    '<div class="row mt wrap" style="margin-top:26px">'+
      (selCount?'<button class="btn btn-primary btn-lg" data-act="qstart">🚀 Start quiz</button>'
        :'<button class="btn btn-lg" disabled>No questions yet</button>')+
      '<span class="small muted">'+(selCount
        ? (selCount<c?('Only '+selCount+' available for '+esc(sel)+' — the quiz will use '+selCount+'.'):(c+' questions • '+esc(sel)))
        : 'Add your own questions to '+esc(sel)+' to get started.')+'</span></div>'+
  '</div>'+
  '<div class="mt"></div>'+
  '<div class="card" style="padding:24px"><h3 class="mb">Quiz tips</h3>'+
    '<div class="listrow"><div style="font-size:20px">🔎</div><div class="small muted" style="flex:1">Search '+SUBJECT_CATALOG.length+' subjects — from Algebra to Zoology — or filter by faculty.</div></div>'+
    '<div class="listrow"><div style="font-size:20px">＋</div><div class="small muted" style="flex:1">No questions for a subject yet? Add your own — they\u2019re saved to your account.</div></div>'+
    '<div class="listrow"><div style="font-size:20px">🔁</div><div class="small muted" style="flex:1">Every wrong answer can be retried immediately after the quiz.</div></div>'+
  '</div>';
}
function quizRun(){
  const q=state.quiz;const cur=q.items[q.i];const pct=Math.round((q.i)/q.items.length*100);
  const fb=q.feedback;
  return '<div class="card" style="padding:26px">'+
    '<div class="between mb"><div class="pill">'+subjIco(cur.subject)+' '+esc(cur.subject)+'</div>'+
      '<div class="small muted">Question '+(q.i+1)+' of '+q.items.length+'</div>'+
      '<button class="btn btn-ghost small" data-act="qquit">Quit</button></div>'+
    '<div class="progressbar mb"><i style="width:'+pct+'%"></i></div>'+
    '<h2 style="margin:22px 0 20px;font-size:24px">'+esc(cur.q)+'</h2>'+
    cur.choices.map((ch,k)=>{
      let cls='choice';
      if(fb){ if(ch===cur.answer)cls+=' right'; else if(ch===fb.picked)cls+=' wrong'; }
      return '<button class="'+cls+'" data-act="qpick" data-c="'+k+'" '+(fb?'disabled':'')+'>'+String.fromCharCode(65+k)+'.  '+esc(ch)+'</button>';
    }).join('')+
    (fb?'<div class="row mt" style="justify-content:flex-end"><span class="pill '+(fb.correct?'pill-good':'pill-bad')+'">'+
      (fb.correct?'✅ Correct!':'❌ Correct answer: '+esc(cur.answer))+'</span>'+
      '<button class="btn btn-primary" data-act="qnext">'+(q.i===q.items.length-1?'See results':'Next →')+'</button></div>':'')+
    '<div class="row mt" style="justify-content:space-between"><span class="small muted">✅ '+q.score+' correct so far</span>'+
    '<span class="small muted">❌ '+q.wrong.length+' to review</span></div>'+
  '</div>';
}
function quizResult(){
  const q=state.quiz;const pct=Math.round(q.score/q.items.length*100);
  const col=pct>=80?'#10b981':pct>=50?'#ffb020':'#ff4d6d';
  const msg=pct>=90?'Outstanding! 🏆':pct>=70?'Nice work! 🎯':pct>=50?'Solid start — review the misses 💪':'Keep going — retry makes it stick 🌱';
  return '<div class="card center" style="padding:34px">'+
    '<div class="ring" style="background:conic-gradient('+col+' '+pct+'%, var(--panel3) 0)">'+
      '<div class="num" style="color:'+col+'">'+pct+'%</div></div>'+
    '<h2 class="mt">'+msg+'</h2>'+
    '<p class="muted">You answered <b>'+q.score+'</b> of <b>'+q.items.length+'</b> correctly in '+esc(q.subject)+'.</p>'+
    '<div class="row" style="justify-content:center;margin-top:12px"><span class="pill">⏱️ '+(q.secs||0)+'s</span>'+
      '<span class="pill">🎯 '+pct+'%</span><span class="pill">❌ '+q.wrong.length+' to review</span></div>'+
    '<div class="row mt" style="justify-content:center;flex-wrap:wrap">'+
      (q.wrong.length?'<button class="btn btn-primary btn-lg" data-act="qretry">🔁 Retry '+q.wrong.length+' wrong</button>':'')+
      '<button class="btn btn-lg" data-act="qnew">New quiz</button>'+
      '<button class="btn btn-lg btn-ghost" data-act="nav" data-view="progress">View progress</button>'+
    '</div>'+
  '</div>'+
  (q.wrong.length?'<div class="card mt" style="padding:24px"><h3 class="mb">Review your misses</h3>'+
    q.wrong.map(w=>'<div class="listrow"><div style="flex:1"><div style="font-weight:800">'+esc(w.q)+'</div>'+
      '<div class="small muted">Your answer: '+esc(w.picked)+'</div>'+
      '<div class="small" style="color:var(--good)">Correct: '+esc(w.answer)+'</div></div></div>').join('')+'</div>':'')+
  '';
}

/* ---------- PROGRESS ---------- */
function viewProgress(u,d){
  const avg=avgScore(d);
  const best=d.attempts.length?Math.max(...d.attempts.map(a=>Math.round(a.correct/a.total*100))):0;
  const totalQ=d.attempts.reduce((s,a)=>s+a.total,0);
  const recent=d.attempts.slice(0,10).reverse();
  const bySubj={};
  d.attempts.forEach(a=>{bySubj[a.subject]=bySubj[a.subject]||{c:0,t:0,n:0};
    bySubj[a.subject].c+=a.correct;bySubj[a.subject].t+=a.total;bySubj[a.subject].n++});
  const weak=Object.entries(bySubj).map(([k,v])=>({s:k,p:Math.round(v.c/v.t*100)})).sort((a,b)=>a.p-b.p);
  const dayLabels=recent.map(a=>new Date(a.date).toLocaleDateString(undefined,{month:'short',day:'numeric'}));
  return '<div class="stats mb">'+
      stat('🎯','Average score',avg+'%','Best: '+best+'%')+
      stat('🧠','Questions answered',totalQ,'Across '+d.attempts.length+' quizzes')+
      stat('🔥','Current streak',streak(d)+' days','Consistency wins')+
      stat('📚','Subjects practiced',Object.keys(bySubj).length,'of '+SUBJECT_CATALOG.length+' available')+
    '</div>'+
    '<div class="card mb" style="padding:24px"><h3 class="mb">Score history</h3>'+
      (recent.length?'<div class="bars">'+recent.map((a,i)=>{
        const p=Math.round(a.correct/a.total*100);
        return '<div class="b" title="'+esc(a.subject)+': '+p+'%"><i style="height:'+Math.max(p,4)+'%"></i><span>'+esc(dayLabels[i])+'</span></div>';
      }).join('')+'</div>':'<div class="muted center" style="padding:30px">Take a quiz to start charting your scores.</div>')+
    '</div>'+
    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">'+
      '<div class="card" style="padding:24px"><h3 class="mb">Mastery by subject</h3>'+
        (weak.length?weak.slice().reverse().map(w=>'<div style="margin-bottom:15px"><div class="between small"><b>'+subjIco(w.s)+' '+esc(w.s)+'</b><span class="muted">'+w.p+'%</span></div>'+
          '<div class="progressbar" style="height:9px;margin-top:6px"><i style="width:'+w.p+'%"></i></div></div>').join('')
        :'<div class="muted small">No data yet.</div>')+'</div>'+
      '<div class="card" style="padding:24px"><h3 class="mb">Topics to practice</h3>'+
        (weak.length?weak.slice(0,3).map(w=>'<div class="listrow"><div style="font-size:20px">'+subjIco(w.s)+'</div>'+
          '<div style="flex:1"><div style="font-weight:900">'+esc(w.s)+'</div><div class="small muted">Scoring '+w.p+'% on average</div></div>'+
          '<span class="pill '+(w.p<70?'pill-bad':'pill-good')+'">'+(w.p<70?'Practice':'Strong')+'</span></div>').join('')
        :'<div class="muted small">Take a few quizzes and weak topics will appear here.</div>')+'</div>'+
    '</div>'+

    '<div class="mt">'+(d.plus?plusAnalytics(d):gate('Advanced study analytics','Unlock per-question timing, difficulty curves, spaced-repetition suggestions and trend forecasting.'))+'</div>'+

function aiToFlashcards(u,noteId){
  const d=userData(u.id);
  if(!d.plus){openModal('<h2>🤖 AI study assistant</h2>'+
    '<p class="muted small">Turning your notes into ready-to-study flashcards is a Lumaro Plus feature.</p>'+
    '<div class="row mt wrap"><button class="btn btn-primary" data-act="upgrade">See Lumaro Plus</button>'+
    '<button class="btn btn-ghost" data-act="modalclose">Not now</button></div>');return}
  const n=d.notes.find(x=>x.id===noteId);if(!n)return;
  const cards=makeCards(n);
  if(!cards.length){toast('Add some content to this note first');return}
  const set={id:uid(),title:'AI · '+n.title,subject:n.subject,created:Date.now(),cards};
  d.sets.unshift(set);saveData(u.id,d);
  openModal('<h2>🤖 Flashcards ready</h2><p class="muted small">Generated <b>'+cards.length+'</b> cards from “'+esc(n.title)+'”.</p>'+
    '<div class="card" style="padding:10px 16px;max-height:230px;overflow:auto">'+
    cards.slice(0,8).map(c=>'<div class="listrow"><div style="flex:1"><b>'+esc(c.q)+'</b><div class="small muted">'+esc(c.a)+'</div></div></div>').join('')+
    '</div>'+
    '<div class="row mt wrap"><button class="btn btn-primary" data-act="aistudy" data-id="'+set.id+'">Study now</button>'+
    '<button class="btn btn-ghost" data-act="modalclose">Close</button></div>');
}
function makeCards(n){
  const lines=String(n.body||'').split(/\n+/)
    .map(s=>s.replace(/^(?:[•\-\*]|\d+[.)])\s*/,'').trim()).filter(Boolean);
  const cards=[];
  lines.forEach(l=>{
    const m=l.split(/\s*(?:—|–|:|=|\s-\s)\s*/).filter(Boolean);
    if(m.length>=2)cards.push({q:'What is '+m[0].trim()+'?',a:m.slice(1).join(' — ').trim()});
    else cards.push({q:'Recall: '+n.title,a:l});
  });
  if(!cards.length)cards.push({q:'What is the main idea of '+n.title+'?',a:n.title});
  return cards.slice(0,40);
}

function sliderFill(sl){if(!sl)return;const mn=+sl.min||0,mx=+sl.max||100,v=+sl.value;

/* fade the subject tiles in/out as they pass the scroll edges of #subjgrid.
   Driven by scroll position rather than a CSS mask, because a mask would turn
   the grid into a backdrop root and kill the glass refraction on the tiles. */
function bindSubjFade(){
  const g=document.querySelector('#subjgrid');if(!g)return;
  const F=36;
  const upd=()=>{
    const list=$$('#subjgrid button');if(!list.length)return;
    const gt=g.getBoundingClientRect().top,h=g.clientHeight;
    if(h<F*2){list.forEach(b=>{b.style.opacity='';b.style.pointerEvents=''});return}
    const rects=list.map(b=>b.getBoundingClientRect());   /* read all, then write */
    list.forEach((b,i)=>{
      const c=(rects[i].top+rects[i].bottom)/2-gt;
      let o=1;
      if(c<F)o=c/F; else if(c>h-F)o=(h-c)/F;
      o=o<0?0:o>1?1:o;
      b.style.opacity=o<0.04?'0':(o>0.96?'':o.toFixed(2));
      b.style.pointerEvents=o<0.3?'none':'';
    });
  };
  g.__upd=upd;
  let raf=0;
  g.addEventListener('scroll',()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;upd()})},{passive:true});
  upd();
}
/* Merge an imported backup into the signed-in user's data. Anything the file
   doesn't carry keeps its current value, so a partial file can't blank things. */
function applyImport(data){
  const u=currentUser();if(!u)return null;
  const cur=userData(u.id);
  const merged={
    notes:Array.isArray(data.notes)?data.notes:cur.notes,
    sets:Array.isArray(data.sets)?data.sets:cur.sets,
    attempts:Array.isArray(data.attempts)?data.attempts:cur.attempts,
    plus:typeof data.plus==='boolean'?data.plus:cur.plus,
    created:cur.created||data.created,
    custom:(data.custom&&typeof data.custom==='object')?data.custom:(cur.custom||{})
  };
  saveData(u.id,merged);
  return merged;
}
/* a Lumaro backup is {user:{name,email},data:{...}}; a bare data object is also accepted */
function readBackup(txt){
  let raw=null;
  try{raw=JSON.parse(txt)}catch(e){return null}
  const d=raw&&typeof raw==='object'&&raw.data&&typeof raw.data==='object'?raw.data:raw;
  if(!d||typeof d!=='object')return null;
  if(!Array.isArray(d.notes)&&!Array.isArray(d.sets)&&!Array.isArray(d.attempts))return null;
  return d;
}

          '<p class="muted">Importing <b>replaces</b> your current '+cur.notes.length+' notes and '+cur.sets.length+' flashcard sets. This can\u2019t be undone.</p>'+
          '<div class="row wrap"><button class="btn btn-primary" data-act="importgo">Replace my data</button>'+
          '<button class="btn btn-ghost" data-act="modalclose">Cancel</button></div>');
      }else{
        const m=applyImport(d);
        toast('Imported '+m.notes.length+' notes, '+m.sets.length+' sets, '+m.attempts.length+' quizzes ✅');render();
      }
    };
    rd.readAsText(f);
  });
  const wr=document.querySelector('[data-act="warp"]');
  if(wr)wr.addEventListener('input',e=>{LS.set('sv_warp',+e.target.value);applyWarp();
    const lbl=e.target.parentElement.querySelector('label');
    if(lbl)lbl.textContent='Warp strength — '+e.target.value;});
  const gb=document.querySelector('[data-act="gblur"]');
  if(gb)gb.addEventListener('input',e=>{LS.set('sv_gblur',+e.target.value);applyLook();
    const lbl=e.target.parentElement.querySelector('label');
    if(lbl)lbl.textContent='Background blur — '+e.target.value+'px';});
  const brt=document.querySelector('[data-act="bright"]');
  if(brt)brt.addEventListener('input',e=>{LS.set('sv_bright',+e.target.value);applyLook();
    const lbl=e.target.parentElement.querySelector('label');
    if(lbl)lbl.textContent='Brightness — '+e.target.value+'%';});
  bindSubjFade();
  const qs=document.querySelector('[data-act="qsearch"]');
  if(qs)qs.addEventListener('input',e=>{state.quizSearch=e.target.value;
    const v=e.target.value.trim().toLowerCase();
    $$('#subjgrid button').forEach(b=>{b.style.display=(!v||(b.dataset.name||'').toLowerCase().includes(v))?'':'none'});
    const gg=document.querySelector('#subjgrid');if(gg&&gg.__upd)gg.__upd();});
  const ns=document.querySelector('[data-act="nsearch"]');
  if(ns)ns.addEventListener('input',e=>{state.search=e.target.value;const v=$('#view');v.innerHTML=renderView(currentUser(),userData(currentUser().id));bindView();ns.focus()});
  const wf=document.querySelector('[data-act="wallfile"]');
  if(wf)wf.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)handleWallpaperFile(f)});
  const wpv=document.querySelector('#wallprev');
  if(wpv){const w=wallData();if(w)wpv.style.backgroundImage='url("'+w+'")'}
  const wd=document.querySelector('[data-act="walldim"]');
  if(wd)wd.addEventListener('input',e=>{
    const v=+e.target.value/100;
    const el=document.querySelector('#wallpaper');if(el)el.style.filter='brightness('+(1-v)+')';
    const lab=wd.parentElement.querySelector('label');if(lab)lab.textContent='Dim background — '+e.target.value+'%';
    LS.set('sv_wall_dim',v);
  });
}
document.addEventListener('click',e=>{
  if(e.target.closest&&e.target.closest('#toast')){hideToast();return}
  const t=e.target.closest('[data-act]');
  if(!t)return;
  const a=t.dataset.act,u=currentUser();
  if(a==='authtab'){state.authTab=t.dataset.tab;render();return}
  if(a==='mode'){setMode(t.dataset.mode);return}
  if(a==='glass'){setGlass(!isGlass());toast(isGlass()?'Liquid Glass on 🫧':'Liquid Glass off');return}
  if(a==='modalclose'){
    /* The backdrop and the Close button share this action. Only a click that
       landed on the backdrop itself should be ignored when it fell inside the
       box — otherwise the button (which lives in the box) could never close. */
    const onBackdrop=t.classList&&t.classList.contains('modal');
    if(onBackdrop&&e.target.closest('.box'))return;
    closeModal();return}
  if(a==='resetcancel'){state.reset=null;state.authTab='forgot';render();return}
  if(a==='verifycancel'){state.verify=null;state.authTab='signup';render();return}
  if(a==='emailsetup'){openModal(emailSetupModal('Lumaro emails your verification and reset codes, so email delivery has to be connected first.'));return}
  if(a==='saveemail'){saveEmailCfg({serviceId:$('#ejs_service').value.trim(),templateId:$('#ejs_template').value.trim(),publicKey:$('#ejs_key').value.trim()});
    closeModal();
    toast(emailReady()?'Email delivery connected ✅':'Saved — fill all three fields to enable sending');
    if(currentUser())render();return}
  if(a==='testemail'){
    const f=document.querySelector('[data-form="signup"] input[name="email"]');
    const to=(currentUser()&&currentUser().email)||(f&&f.value.trim())||state.pendingEmail||'';
    if(!to){toast('Enter an email address first');return}
    if(!emailReady()){toast('Fill in all three EmailJS fields first');return}
    toast('Sending test email…');
    sendEmail(to,'Lumaro test email','This is a test from Lumaro. If you can read this, email delivery works!')
      .then(r=>toast(r.ok?'Test email sent to '+to+' ✅':('Send failed: '+(r.reason||'error'))));return}
  if(a==='resend'){const v=state.verify;if(!v)return;
    if(!emailReady()){openModal(emailSetupModal('Connect email delivery to resend your verification code.'));return}
    const code=code6(),exp=Date.now()+CODE_TTL;putCode(v.userId,code,exp);v.status='sending';render();
    sendEmail(v.email,'Your Lumaro verification code','Your Lumaro verification code is: '+code,otpVars(code,exp)).then(r=>{
      const vv=state.verify;if(!vv)return;vv.status=r.ok?'sent':(r.reason||'error');render();
      toast(r.ok?'Code resent to '+vv.email:'Could not send the email');});
    return}
  if(!u)return;
  const d=userData(u.id);
  /* Leaving the quiz view does NOT drop the quiz - come back and finish it. */
  if(a==='nav'){state.view=t.dataset.view;state.study=null;state.noteEdit=null;state.setEdit=null;render();return}
  if(a==='logout'){logout();return}
  /* quiz */
  if(a==='qsubj'){state.quizSubject=t.dataset.s;render();return}
  if(a==='qcat'){state.quizCat=t.dataset.c;render();return}
  if(a==='qnum'){state.quizCount=+t.dataset.n;render();return}
  if(a==='addq'){openModal(addQuestionsModal(t.dataset.s,d));return}
  if(a==='qrowadd'){const box=$('#qrows');if(box)box.insertAdjacentHTML('beforeend',qRow());return}
  if(a==='qrowdel'){const row=t.closest('.qrow'),box=$('#qrows');if(row&&box&&box.children.length>1)row.remove();else toast('Keep at least one question');return}
  if(a==='saveq'){
    const s=t.dataset.s;
    const rows=$$('.qrow').map(r=>({q:r.querySelector('.qq').value.trim(),a:r.querySelector('.qa').value.trim(),
      w:r.querySelector('.qw').value.split(',').map(x=>x.trim()).filter(Boolean)})).filter(r=>r.q&&r.a);
    if(!rows.length){toast('Add at least one question and its answer');return}
    d.custom=d.custom||{};d.custom[s]=d.custom[s]||[];
    rows.forEach(r=>{const wrong=r.w.length?r.w:['Not sure','None of these','I don\u2019t know'];
      d.custom[s].push({q:r.q,choices:shuffle([r.a].concat(wrong.slice(0,3))),answer:r.a})});
    saveData(u.id,d);closeModal();toast(rows.length+' question(s) added to '+s);render();return;
  }
  if(a==='qstart'){const items=buildQuiz(state.quizSubject,state.quizCount,d);
    if(!items.length){toast('No questions for that subject yet — add your own');return}
    state.quiz={stage:'run',items,i:0,score:0,wrong:[],feedback:null,subject:state.quizSubject,started:Date.now()};render();return}
  /* With a quiz already running this resumes it instead of silently throwing
     the attempt away - that is the whole point of being able to leave it. */
  if(a==='startquick'){state.view='quiz';render();return}
  if(a==='qpick'){
    const q=state.quiz,cur=q.items[q.i],k=+t.dataset.c,picked=cur.choices[k];
    const correct=picked===cur.answer;
    q.feedback={picked,correct};
    if(correct)q.score++;else q.wrong.push({q:cur.q,answer:cur.answer,picked,subject:cur.subject});
    render();return;
  }
  if(a==='qnext'){
    const q=state.quiz;q.feedback=null;
    if(q.i===q.items.length-1){
      q.secs=Math.max(1,Math.round((Date.now()-(q.started||Date.now()))/1000));
      d.attempts.unshift({id:uid(),subject:q.subject,total:q.items.length,correct:q.score,date:Date.now(),time:q.secs,wrong:q.wrong});
      saveData(u.id,d);q.stage='result';
    } else q.i++;
    render();return;
  }
  if(a==='qretry'){
    const wrong=state.quiz.wrong.map(w=>{
      const src=poolFor('Mixed',d).find(x=>x.q===w.q)||{q:w.q,choices:[w.answer,w.picked],answer:w.answer,subject:w.subject};
      return src});
    state.quiz={stage:'run',items:shuffle(wrong),i:0,score:0,wrong:[],feedback:null,subject:state.quiz.subject+' (retry)',started:Date.now()};
    render();return;
  }
  if(a==='qnew'){state.quiz=null;render();return}
  if(a==='qquit'){state.quiz=null;render();return}
  /* notes */
  if(a==='nnew'){state.noteEdit='new';render();return}
  if(a==='ai'){aiToFlashcards(u,t.dataset.id);return}
  if(a==='aistudy'){state.view='flash';state.study={id:t.dataset.id,i:0,flip:false};closeModal();render();return}
  if(a==='nopen'){state.noteEdit=t.dataset.id;render();return}
  if(a==='nclose'){state.noteEdit=null;render();return}
  if(a==='nsubj'){state.subjectFilter=t.dataset.s;render();return}
  if(a==='nsave'){
    const title=$('#nt').value.trim()||'Untitled note',subject=$('#ns').value.trim()||'General',body=$('#nb').value;
    if(state.noteEdit==='new')d.notes.unshift({id:uid(),title,subject,body,updated:Date.now()});
    else{const n=d.notes.find(x=>x.id===state.noteEdit);if(n){n.title=title;n.subject=subject;n.body=body;n.updated=Date.now()}}
    saveData(u.id,d);state.noteEdit=null;toast('Note saved');render();return;
  }
  if(a==='ndel'){d.notes=d.notes.filter(x=>x.id!==t.dataset.id);saveData(u.id,d);state.noteEdit=null;toast('Note deleted');render();return}
  /* flashcards */
  if(a==='fnew'){state.setEdit='new';render();return}
  if(a==='fedit'){state.setEdit=t.dataset.id;render();return}
  if(a==='fclose'){state.setEdit=null;render();return}
  if(a==='fadd'){const box=$('#cards');const i=box.children.length;box.insertAdjacentHTML('beforeend',cardRow({q:'',a:''},i));return}
  if(a==='fremove'){t.closest('.cardrow').remove();return}
  if(a==='fsave'){
    const title=$('#ft').value.trim()||'Untitled set',subject=$('#fs').value.trim()||'General';
    const cards=$$('.cardrow').map(r=>({q:r.querySelector('.cq').value.trim(),a:r.querySelector('.ca').value.trim()})).filter(c=>c.q||c.a);
    if(state.setEdit==='new')d.sets.unshift({id:uid(),title,subject,created:Date.now(),cards});
    else{const s=d.sets.find(x=>x.id===state.setEdit);if(s){s.title=title;s.subject=subject;s.cards=cards}}
    saveData(u.id,d);state.setEdit=null;toast('Flashcard set saved');render();return;
  }
  if(a==='fdel'){d.sets=d.sets.filter(x=>x.id!==t.dataset.id);saveData(u.id,d);state.setEdit=null;toast('Set deleted');render();return}
  if(a==='fstudy'){state.study={id:t.dataset.id,i:0,flip:false};render();return}
  if(a==='fexit'){state.study=null;render();return}
  if(a==='fflip'){state.study.flip=!state.study.flip;render();return}
  if(a==='fnext'){state.study.i++;state.study.flip=false;render();return}
  if(a==='fprev'){const s=d.sets.find(x=>x.id===state.study.id);state.study.i=(state.study.i-1+s.cards.length)%s.cards.length;state.study.flip=false;render();return}
  if(a==='fshuffle'){const s=d.sets.find(x=>x.id===state.study.id);s.cards=shuffle(s.cards);saveData(u.id,d);state.study.i=0;state.study.flip=false;toast('Shuffled');render();return}
  /* settings */
  if(a==='upgrade'){openModal(checkoutModal(d));return}
  if(a==='pluson'){d.plus=true;saveData(u.id,d);closeModal();toast('Lumaro Plus activated ⭐');render();return}
  if(a==='plusoff'){d.plus=false;saveData(u.id,d);closeModal();toast('Back on the Free plan');render();return}
  if(a==='wallpick'){const f=$('[data-act="wallfile"]');if(f)f.click();return}
  if(a==='wallclear'){LS.del('sv_wall');toast('Background removed');render();return}

  if(a==='usave'){const n=$('#un').value.trim(),em=$('#ue').value.trim().toLowerCase();
    if(n.length<2||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){toast('Please enter a valid name and email');return}
    const all=users(),me=all.find(x=>x.id===u.id);
    if(all.some(x=>x.email===em&&x.id!==u.id)){toast('That email is already in use');return}
    me.name=n;me.email=em;saveUsers(all);toast('Account updated');render();return}
  if(a==='import'){const inp=$('#importfile');if(inp)inp.click();return}
  if(a==='importgo'){
    const d=state.pendingImport;state.pendingImport=null;closeModal();
    if(d){const m=applyImport(d);
      toast('Imported '+m.notes.length+' notes, '+m.sets.length+' sets, '+m.attempts.length+' quizzes ✅');render()}
    return}
  if(a==='export'){
    const json=JSON.stringify({user:{name:u.name,email:u.email},data:d},null,2);
    openModal('<h2>⬇️ Export your data</h2><p class="muted small">A JSON copy of your account. Keep it somewhere safe.</p>'+
      '<textarea id="expjson" rows="12" readonly>'+esc(json)+'</textarea>'+
      '<div class="row mt wrap"><button class="btn btn-primary" data-act="exportdl">Download file</button>'+
      '<button class="btn" data-act="copyjson">Copy</button>'+
      '<button class="btn btn-ghost" data-act="modalclose">Close</button></div>');
    return;
  }
  if(a==='exportdl'){
    try{
      const blob=new Blob([$('#expjson').value],{type:'application/json'});
      const url=URL.createObjectURL(blob);const link=document.createElement('a');
      link.href=url;link.download='lumaro-'+u.name.toLowerCase().replace(/\s+/g,'-')+'.json';
      document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url);
      toast('Export downloaded');
    }catch(err){toast('Download blocked here — copy the text instead')}
    return;
  }
  if(a==='copyjson'){
    const ta=$('#expjson');if(ta){ta.select();try{document.execCommand('copy')}catch(err){}
      if(navigator.clipboard)navigator.clipboard.writeText(ta.value).catch(()=>{});}
    toast('Copied to clipboard');return;
  }
  if(a==='reset'){openModal('<h2>Reset study data?</h2><p class="muted small">This clears the notes, flashcards and quiz scores for <b>'+esc(u.name)+'</b>. It cannot be undone.</p>'+
    '<div class="row mt wrap"><button class="btn btn-danger" data-act="resetgo">Yes, reset everything</button>'+
    '<button class="btn btn-ghost" data-act="modalclose">Cancel</button></div>');return}
  if(a==='resetgo'){saveData(u.id,{notes:[],sets:[],attempts:[],plus:d.plus,created:d.created});closeModal();toast('Study data reset');render();return}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target.dataset.form;if(!f)return;
  const fd=new FormData(e.target);
  if(f==='login'){const r=login(fd.get('email'),fd.get('password'));
    if(r.err)toast(r.err);else{toast('Welcome back!');render()}}
  if(f==='signup'){
    const chk=checkEmail(fd.get('email'));
    if(chk.err){toast(chk.err);return}
    if(REQUIRE_EMAIL_VERIFY&&!emailReady()){
      state.pendingEmail=chk.email;
      openModal(emailSetupModal('Lumaro emails your 6-digit code, so email delivery must be connected before the account can be created. The code is never shown on screen.'));
      return;
    }
    const r=signup(fd.get('name'),fd.get('email'),fd.get('password'));
    if(r.err){toast(r.err);return}
    if(REQUIRE_EMAIL_VERIFY){startVerify(r.user);return}
    /* verification is off — activate the account and sign in immediately */
    const all=users(),me=all.find(x=>x.id===r.user.id);
    if(me){me.verified=true;saveUsers(all)}
    LS.set('sv_session',r.user.id);
    state.authTab='login';
    toast('Welcome to Lumaro, '+r.user.name.split(' ')[0]+' 🎉');render();
  }
  if(f==='verify'){
    const v=state.verify||{};
    const code=(fd.get('code')||'').trim();
    const ck=codeOk(v.userId,code);
    if(!ck.ok){toast(ck.err);return}
    const all=users(),me=all.find(x=>x.id===v.userId);
    if(me){me.verified=true;saveUsers(all)}
    LS.set('sv_session',v.userId);
    state.verify=null;state.authTab='login';
    toast('Email verified — welcome to Lumaro 🎉');render();
  }
  if(f==='forgot'){
    const chk=checkEmail(fd.get('email'));
    if(chk.err){toast(chk.err);return}
    const me=users().find(x=>x.email===chk.email);
    if(!me){toast('No account found with that email');return}
    if(!emailReady()){
      state.pendingEmail=me.email;
      if(REQUIRE_EMAIL_VERIFY){openModal(emailSetupModal('Connect email delivery so we can send your password reset code. The code is never shown on screen.'));return}
      toast('Password reset needs email delivery — use 📧 Email setup');return;
    }
    const code=code6(),exp=Date.now()+CODE_TTL;putCode(me.id,code,exp);
    state.reset={email:me.email,userId:me.id,status:'sending'};render();
    sendEmail(me.email,'Your Lumaro password reset code','Your Lumaro password reset code is: '+code,otpVars(code,exp)).then(res=>{
      const r=state.reset;if(!r)return;r.status=res.ok?'sent':(res.reason||'error');render();
      toast(res.ok?'Recovery code sent to '+r.email:'Could not send the email');
    });
  }
  if(f==='reset'){
    const r=state.reset||{};
    const code=(fd.get('code')||'').trim();
    const p1=fd.get('password')||'',p2=fd.get('password2')||'';
    const ck=codeOk(r.userId,code);
    if(!ck.ok){toast(ck.err);return}
    if(p1.length<6){toast('Password must be at least 6 characters');return}
    if(p1!==p2){toast('Passwords do not match');return}
    const all=users(),me=all.find(x=>x.id===r.userId);
    if(!me){toast('That account no longer exists');state.reset=null;render();return}
    me.pass=hash(p1);saveUsers(all);
    state.reset=null;state.authTab='login';render();toast('Password updated — log in with it 🔐');
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();return}
  const q=state.quiz;
  if(state.view!=='quiz'||!q||q.stage!=='run')return;
  if(q.feedback){if(e.key==='Enter'||e.key===' '){e.preventDefault();const n=document.querySelector('[data-act="qnext"]');if(n)n.click()}return}
  const k=(e.key||'').toLowerCase();
  let i='1234'.indexOf(k);if(i<0)i='abcd'.indexOf(k);
  if(i>=0&&i<q.items[q.i].choices.length){e.preventDefault();
    const c=document.querySelectorAll('[data-act="qpick"]')[i];if(c)c.click()}

});
/* one-time cleanup — the demo account has been removed from the app */
(function(){
  const all=users();
  const gone=all.filter(x=>/^demo@(lumaro|studyvault)\.app$/.test(x.email));
  if(!gone.length)return;
  saveUsers(all.filter(x=>gone.indexOf(x)<0));
  gone.forEach(x=>LS.del('sv_data_'+x.id));
  const sid=LS.get('sv_session',null);
  if(sid&&gone.some(x=>x.id===sid))LS.del('sv_session');
})();

render();
</script>

<section id="lumaro-ai-chat" style="max-width:700px;margin:30px auto;padding:20px;background:#111827;color:white;border-radius:16px;font-family:Arial,sans-serif">
  <h2>Ask Lumaro AI</h2>
  <p>Ask a question or get help studying.</p>
  <textarea id="lumaro-question" placeholder="Ask Lumaro anything..." style="box-sizing:border-box;width:100%;min-height:100px;padding:12px;border-radius:10px"></textarea>
  <button id="lumaro-ask" style="margin-top:10px;padding:12px 18px;border:0;border-radius:8px;cursor:pointer">Ask Lumaro</button>
  <p id="lumaro-status" role="status">Ready when you are.</p>
  <div id="lumaro-answer" style="white-space:pre-wrap;line-height:1.6"></div>
</section>

<script>
document.getElementById("lumaro-ask").addEventListener("click", async () => {
  const questionBox = document.getElementById("lumaro-question");
  const status = document.getElementById("lumaro-status");
  const answerBox = document.getElementById("lumaro-answer");
  const question = questionBox.value.trim();

  if (!question) {
    status.textContent = "Type a question first.";
    return;
  }

  status.textContent = "Lumaro is thinking...";
  answerBox.textContent = "";

  try {
    const response = await fetch("/.netlify/functions/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "The AI could not answer.");
    }

    answerBox.textContent = data.answer;
    status.textContent = "Answered by Lumaro AI.";
  } catch (error) {
    status.textContent = "Couldn't get an answer: " + error.message;
  }
});
</script>
